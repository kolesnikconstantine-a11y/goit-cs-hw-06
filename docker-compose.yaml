version: '3.8'

services:
  app:
    build: .
    container_name: web_socket_app
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data: